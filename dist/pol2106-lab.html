<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POL2106 · ห้องติวและฝึกสอบ</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f4fa;color:#172746;font:17px/1.65 system-ui,sans-serif}main{max-width:840px;margin:auto;padding:20px}article,details{background:white;border:1px solid #cdd8e8;border-radius:14px;padding:16px;margin:12px 0}summary{font-weight:700;cursor:pointer}a{color:#154caa}button,select,input{font:inherit;max-width:100%;min-height:44px;padding:6px 10px;background:white;border:1px solid #879ab9;border-radius:8px;color:#183457}button{cursor:pointer}button:disabled{opacity:.6}#choices button{text-align:left;display:block;width:100%;margin:6px 0}h1,h2,h3{line-height:1.3}#feedback{background:#edf4ff;padding:12px}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#why{white-space:pre-line}small{color:#43516a}p{margin:8px 0}</style><main>
<a href="./#practice">← เลือกวิชาฝึกสอบ</a><h1>POL2106 · ปรัชญาการเมืองเบื้องต้น</h1>
<h2>ข้อสอบเก่า · 7 ชุด 700 ข้อ</h2><p id="cloud" role="status">กำลังโหลดคลังข้อสอบจาก Supabase…</p><button id="retry" hidden>ลองเชื่อมต่ออีกครั้ง</button><article id="lab" hidden><label>ชุดข้อสอบ <select id="sets"></select></label> <label>เลขข้อ <select id="num"></select></label>
<p id="meta"></p><h3 id="stem"></h3><div id="choices"></div><section id="feedback" hidden aria-live="polite"><b id="result"></b><p id="note"></p><details><summary>ดูคำอธิบายจากเอกสารเดิม</summary><p id="why"></p></details></section>
<p id="score"></p><nav><button id="prev">← ก่อนหน้า</button><button id="next">ถัดไป →</button><button id="random">สุ่มข้อที่ยังไม่ตอบ</button><button id="wrong">ทบทวนข้อที่ผิด</button></nav><details><summary>เกี่ยวกับคะแนน</summary><small>คำตอบและคะแนนใช้ร่วมกันทุกเครื่องในห้องเรียนนี้ · ข้อที่กำกวมไม่รวมคะแนน · เฉลยจากเอกสารฝึก ไม่ใช่เฉลยทางการของมหาวิทยาลัย</small></details></article><p id="notice" role="status"></p></main>
<script id="bank" type="application/json">[]</script>
<script type="module">
import {loadBank,sharedAnswers} from "./pol2106-sync.js";
const $=id=>document.getElementById(id),names=['รวม 5 ภาค · 2/2568','รวม 5 ภาค · 1/2568','รวม 5 ภาค · ฤดูร้อน 2567','รวม 5 ภาค · 1/2567','รวม 5 ภาค · ฤดูร้อน 2566','ลับเฉพาะ 1/2569 · ชุด 1','ลับเฉพาะ 1/2569 · ชุด 2'];let bank,ix=0,history={};
function init(b){if(!Array.isArray(b)||b.length!==700||b.some((a,i)=>a.s!==1+Math.floor(i/100)||a.n!==1+i%100||typeof a.stem!=='string'||!Array.isArray(a.options)||a.options.length!==5||!a.options.every(o=>typeof o==='string')||!(a.k===null||(Number.isInteger(a.k)&&a.k>=1&&a.k<=5))))throw Error('รูปแบบคลังไม่ตรง');bank=b;$('sets').replaceChildren(...names.map((n,i)=>new Option(n,i)));$('num').replaceChildren(...Array.from({length:100},(_,i)=>new Option(i+1,i)));$('lab').hidden=false;show(0)}
function show(i){ix=i;let a=bank[i],v=history[i];$('sets').value=a.s-1;$('num').value=a.n-1;$('meta').textContent=names[a.s-1]+' · หน้า PDF '+a.p+' · ข้อ '+a.n+' / 100';$('stem').textContent=a.stem;$('choices').replaceChildren(...a.options.map((o,j)=>{let b=document.createElement('button');b.textContent=(j+1)+'. '+o;b.onclick=()=>{cloud.answer(i,j+1)};return b}));$('feedback').hidden=!v;$('result').textContent=!v?'':a.k===null?'ข้อนี้ไม่นับคะแนน':(v===a.k?'ถูกต้อง':'คุณเลือก '+v+' · เฉลย '+a.k)+' — '+a.options[a.k-1];$('why').textContent=a.why;$('note').textContent=a.note||'';$('feedback').querySelector('details').open=false;let done=bank.filter(x=>x.s===a.s&&history[100*(x.s-1)+x.n-1]);let graded=done.filter(x=>x.k!==null);$('score').textContent='ชุดนี้ตอบแล้ว '+done.length+'/100 · ถูก '+graded.filter(x=>history[100*(x.s-1)+x.n-1]===x.k).length+' จาก '+graded.length+' ข้อที่นับคะแนน';$('prev').disabled=i%100===0;$('next').disabled=i%100===99;$('notice').textContent=''}
$('prev').onclick=()=>show(ix-1);$('next').onclick=()=>show(ix+1);$('sets').onchange=()=>show(100*Number($('sets').value));$('num').onchange=()=>show(100*Math.floor(ix/100)+Number($('num').value));function choose(wrong){const list=bank.map((x,i)=>i).filter(i=>Math.floor(i/100)===Math.floor(ix/100)&&(wrong?(history[i]&&bank[i].k&&history[i]!==bank[i].k):!history[i]));if(list.length)show(list[Math.floor(Math.random()*list.length)]);else $('notice').textContent=wrong?'ไม่มีข้อที่ตอบผิดในชุดนี้':'ตอบครบชุดนี้แล้ว'}$('random').onclick=()=>choose(false);$('wrong').onclick=()=>choose(true);
const cloud=sharedAnswers({storage:localStorage,onUpdate:v=>{const changed=JSON.stringify(history)!==JSON.stringify(v);history=v;if(bank&&changed)show(ix)},status:t=>{$('cloud').textContent=t}});
let booting=false;
async function boot(){if(booting)return;booting=true;try{const data=await loadBank();init(data);try{localStorage.setItem('pol2106-private-v1',JSON.stringify(data))}catch{}$('retry').hidden=true;await cloud.sync()}catch{try{if(!bank)init(JSON.parse(localStorage.getItem('pol2106-private-v1')))}catch{}$('cloud').textContent=bank?'ใช้คลังที่เคยโหลด · ยังไม่เชื่อมต่อ':'โหลดคลังข้อสอบไม่ได้ กรุณาตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง';$('retry').hidden=false}finally{booting=false}}
function refresh(){if(!bank||!$('retry').hidden)void boot();else void cloud.sync()}
$('retry').onclick=boot;window.addEventListener('online',refresh);window.addEventListener('focus',refresh);setInterval(()=>{if(!document.hidden)refresh()},7000);void boot();
</script></html>
