name: Notebook browser checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Shape gallery and branch ink
        run: PAPER_TEST=branches node tests/browser/paper.mjs
      - name: Direct photo crop
        run: PAPER_TEST=crop node tests/browser/paper.mjs
      - name: Inline notebook tables
        run: PAPER_TEST=tables node tests/browser/paper.mjs
      - run: node tests/browser/paper.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-browser-screenshots
          path: test-results
